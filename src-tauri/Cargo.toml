[package]
name = "pro-art-mail"
version = "0.2.0"
description = "Pro-Art Mail"
authors = ["Robert Nillesen"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pro_art_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0.10"
futures = "0.3.34"
mail-parser = "0.11.9"
ammonia = "4.2.4"
utf7-imap = "0.3.2"
anyhow = "1.0.104"
keyring = "4.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
tauri-plugin-dialog = "2.8.3"
base64 = "0.23.1"
mime_guess = "2.0.5"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
